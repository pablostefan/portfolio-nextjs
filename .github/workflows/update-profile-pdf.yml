name: Update Profile from LinkedIn PDF

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'URL direta do PDF do LinkedIn (Google Drive, Dropbox, etc.)'
        required: true
        type: string
      skip_ai:
        description: 'Pular enriquecimento com AI (só parse do PDF)'
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read   # GitHub Models API (gpt-4o free with Copilot)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download LinkedIn PDF
        run: |
          curl -L "${{ github.event.inputs.pdf_url }}" \
               -o linkedin.pdf \
               --fail \
               --silent \
               --show-error
          echo "✅ PDF baixado ($(wc -c < linkedin.pdf) bytes)"

      - name: Parse and update profile.json
        run: node scripts/parse-linkedin-pdf.js linkedin.pdf

      - name: Enhance with AI (PT polish + EN translations)
        if: ${{ !inputs.skip_ai }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/enhance-profile-ai.js

      - name: Show diff
        run: git diff data/profile.json || echo "(sem alterações)"

      - name: Remove PDF (privacidade)
        run: rm -f linkedin.pdf

      - name: Commit updated profile
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/profile.json
          git diff --staged --quiet \
            && echo "Nenhuma alteração para commitar" \
            || git commit -m "chore: update profile from LinkedIn PDF [skip ci]"

      - name: Push changes
        run: git push
