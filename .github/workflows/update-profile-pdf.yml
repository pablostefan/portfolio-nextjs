name: Update Profile from LinkedIn PDF

on:
  push:
    branches: [main]
    paths:
      - 'uploads/linkedin/**.pdf'
  workflow_dispatch:
    inputs:
      skip_ai:
        description: 'Pular enriquecimento com AI (só parse do PDF)'
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read   # GitHub Models API (gpt-4o free with Copilot)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Find LinkedIn PDF
        id: find_pdf
        run: |
          PDF=$(find uploads/linkedin -name '*.pdf' | head -1)
          if [ -z "$PDF" ]; then
            echo "Nenhum PDF encontrado em uploads/linkedin/"
            exit 1
          fi
          echo "pdf=$PDF" >> $GITHUB_OUTPUT
          echo "✅ PDF encontrado: $PDF ($(wc -c < "$PDF") bytes)"

      - name: Parse and update profile.json
        run: node scripts/parse-linkedin-pdf.js "${{ steps.find_pdf.outputs.pdf }}"

      - name: Enhance with AI (PT polish + EN translations)
        if: ${{ !inputs.skip_ai }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/enhance-profile-ai.js

      - name: Show diff
        run: git diff data/profile.json || echo "(sem alterações)"

      - name: Remove PDF (privacidade) e commitar
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          rm -f "${{ steps.find_pdf.outputs.pdf }}"
          git add data/profile.json uploads/linkedin/
          git diff --staged --quiet \
            && echo "Nenhuma alteração para commitar" \
            || git commit -m "chore: update profile from LinkedIn PDF [skip ci]"

      - name: Push changes
        run: git push
