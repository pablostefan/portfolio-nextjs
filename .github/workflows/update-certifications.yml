name: Update Certifications from PDFs

on:
  push:
    branches: [main]
    paths:
      - 'uploads/certs/**.pdf'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse PDFs → certifications.json
        run: node scripts/parse-cert-pdfs.js

      - name: Show diff
        run: git diff data/certifications.json || echo "(sem alterações)"

      - name: Commit updated certifications
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          find uploads/certs -name '*.pdf' -delete
          git add data/certifications.json uploads/certs/
          git diff --staged --quiet \
            && echo "Nenhuma alteração para commitar" \
            || git commit -m "chore: update certifications from PDFs [skip ci]"

      - name: Push changes
        run: git push
